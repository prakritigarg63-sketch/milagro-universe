<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Milagro Universe</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf8f4;
        color: #102a43;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1824; color: #faf8f4; }
      }
      .card { max-width: 380px; text-align: center; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 18px; background: rgba(22, 138, 173, 0.12); color: #168aad;
        font-size: 30px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; opacity: 0.8; font-size: 14.5px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        padding: 12px 22px; border-radius: 999px;
        background: #a66a32; color: #fff; font-weight: 600; font-size: 14.5px;
      }
      button:hover { background: #8a5729; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">◍</div>
      <h1>You’re offline</h1>
      <p>Milagro Universe needs a connection to load this page. Your saved plans are safe — they’ll be here when you reconnect.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
